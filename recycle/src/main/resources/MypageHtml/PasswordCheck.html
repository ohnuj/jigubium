<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 - 본인 확인</title>
</head>
<body>
<div style="display: flex; gap: 40px;">
    <!-- 좌측 3가지 탭 메뉴 (1번 탭 강조) -->
    <aside>
        <ul>
            <li style="font-weight: bold;"><a th:href="@{/mypage/memberinfoconfirm}">회원정보 수정</a></li>
            <li><a th:href="@{/mypage/memberactivity}">회원활동 조회</a></li>
            <li><a th:href="@{/mypage/memberdelete}">회원 탈퇴</a></li>
        </ul>
    </aside>

    <!-- 본인 확인 폼 본문 -->
    <main>
        <h2>회원정보 수정</h2>
        <p>개인정보 보호를 위해 현재 비밀번호를 입력해주세요.</p>

        <form th:action="@{/mypage/checkpassword}" method="post">
            <div>
                <label for="password">비밀번호 확인</label><br>
                <input type="password" id="password" name="password" placeholder="현재 비밀번호 입력" required>
            </div>

            <!-- 비밀번호 불일치 에러 메시지 -->
            <p th:if="${errorMsg}" style="color: red;" th:text="${errorMsg}"></p>

            <button type="submit" style="margin-top: 10px; padding: 6px 12px; cursor: pointer;">
                확인
            </button>
        </form>
    </main>
</div>
</body>
</html>
