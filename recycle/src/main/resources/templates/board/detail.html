<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
</head>
<body>
<nav>
    <div>
        <a th:href="@{/}">Home</a>
        <th:block th:unless="${session.checkLogin}">
            <a th:href="@{/login}">로그인</a>
            <a th:href="@{/signup}">회원가입</a>
        </th:block>

        <th:block th:if="${session.checkLogin}">
            <a th:href="@{/mypage}">마이페이지</a>
            <a th:href="@{/logout}">로그아웃</a>
            <a th:href="@{/reward}">리워드 상점</a>
        </th:block>
    </div>
</nav>

<h2>게시글 상세</h2>

<div>
    <p>
        타입:
        <span th:if="${board.boardType.name() == 'FREE'}">자유</span>
        <span th:if="${board.boardType.name() == 'INFO'}">정보</span>
        <span th:if="${board.boardType.name() == 'SUGGESTION'}">건의</span>
    </p>

  <p>
    제목:
    <span th:text="${board.title}"></span>
  </p>

  <p>
    작성자:
    <span th:text="${board.nickname}"></span>
  </p>

    <p>
        작성일:
        <span th:text="${#temporals.format(
            board.createdAt,
            'yyyy-MM-dd HH:mm')}">
    </span>

        <span th:if="${board.modified}">
        (수정됨)
    </span>
    </p>

    <p>
        조회수:
        <span th:text="${board.viewCount}">
            0
        </span>
    </p>

    <p>
        좋아요:
        <span th:text="${board.likeCount}">
            0
        </span>
    </p>

    <!-- 로그인했고, 작성자가 아닐 때만 좋아요 버튼 -->
    <form th:if="${loginUser != null
        and loginUser.memberId != board.memberId}"
          th:action="@{/boards/{boardId}/like(
            boardId=${board.boardId}
      )}"
          method="post">

        <button type="submit"
                th:text="${board.liked ? '좋아요 취소' : '좋아요'}">
            좋아요
        </button>
    </form>
</div>

<hr>

<div>
  <p th:text="${board.content}"></p>
</div>

<!--첨부 이미지-->
<div th:if="${board.images != null}">

    <div th:each="image : ${board.images}">
        <img th:src="${image.imageUrl}"
             alt="게시글 이미지">
    </div>

</div>

<hr>

<!-- 이전글 / 다음글 -->
<div>

    <!-- 이전글 -->
    <div th:if="${previousBoard != null}">
        이전글:
        <a th:href="@{/boards/{boardId}(
                boardId=${previousBoard.boardId}
            )}"
           th:text="${previousBoard.title}">
            이전글 제목
        </a>
    </div>

    <div th:if="${previousBoard == null}">
        이전글: 없습니다.
    </div>

    <!-- 다음글 -->
    <div th:if="${nextBoard != null}">
        다음글:
        <a th:href="@{/boards/{boardId}(
                boardId=${nextBoard.boardId}
            )}"
           th:text="${nextBoard.title}">
            다음글 제목
        </a>
    </div>

    <div th:if="${nextBoard == null}">
        다음글: 없습니다.
    </div>

</div>

<hr>

<h3>
    댓글 (
    <span th:text="${commentPaging.totalCount}">0</span>
    )
</h3>

<!-- 로그인 사용자만 댓글 작성 가능 -->
<form th:if="${loginUser != null}"
      th:action="@{/boards/{boardId}/comments(boardId=${board.boardId})}"
      method="post">

    <textarea name="content"
              placeholder="댓글을 입력하세요"
              required></textarea>

    <button type="submit">
        댓글 작성
    </button>
</form>

<!-- 비로그인 사용자 -->
<div th:if="${loginUser == null}">
    <p>
        댓글을 작성하려면 로그인이 필요합니다.
    </p>

    <a th:href="@{/login}">
        로그인
    </a>
</div>

<!-- 댓글 목록 -->
<div th:each="comment : ${comments}">

    <!-- 작성자 -->
    <span th:text="${comment.nickname}">
        닉네임
    </span>

    <!-- 작성일 -->
    <span th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">
        작성일
    </span>

    <!-- 수정 여부 -->
    <span th:if="${comment.modified}">
        (수정됨)
    </span>

    <!-- 댓글 내용 -->
    <p th:text="${comment.content}">
        댓글 내용
    </p>

    <!-- 본인 댓글일 때만 수정/삭제 표시 -->
    <div th:if="${loginUser != null
            and loginUser.memberId == comment.memberId}">

        <!-- 처음에는 수정/삭제 버튼만 표시 -->
        <button type="button"
                th:onclick="'toggleEdit(' + ${comment.commentId} + ')'">
            수정
        </button>

        <form th:action="@{/boards/{boardId}/comments/{commentId}/delete(
                boardId=${board.boardId},
                commentId=${comment.commentId}
              )}"
              method="post"
              style="display: inline;"
              onsubmit="return confirm('정말 삭제하시겠습니까?');">

            <button type="submit">
                삭제
            </button>
        </form>

        <!-- 수정 버튼을 눌렀을 때만 보이는 수정 폼 -->
        <div th:id="'editForm-' + ${comment.commentId}"
             style="display: none;">

            <form th:action="@{/boards/{boardId}/comments/{commentId}/edit(
                    boardId=${board.boardId},
                    commentId=${comment.commentId}
                  )}"
                  method="post">

                <textarea name="content"
                          th:text="${comment.content}"
                          required></textarea>

                <button type="submit">
                    수정 완료
                </button>

                <button type="button"
                        th:onclick="'toggleEdit(' + ${comment.commentId} + ')'">
                    취소
                </button>
            </form>
        </div>

    </div>

    <hr>


</div>

<div th:if="${commentPaging.totalPages > 0}">

    <a th:if="${commentPaging.page > 1}"
       th:href="@{/boards/{boardId}(
            boardId=${board.boardId},
            commentPage=${commentPaging.page - 1}
       )}">
        이전
    </a>

    <span th:each="pageNum :
            ${#numbers.sequence(1, commentPaging.totalPages)}">

        <a th:if="${pageNum != commentPaging.page}"
           th:href="@{/boards/{boardId}(
                boardId=${board.boardId},
                commentPage=${pageNum}
           )}"
           th:text="${pageNum}">
        </a>

        <strong th:if="${pageNum == commentPaging.page}"
                th:text="${pageNum}">
        </strong>
    </span>

    <a th:if="${commentPaging.page < commentPaging.totalPages}"
       th:href="@{/boards/{boardId}(
            boardId=${board.boardId},
            commentPage=${commentPaging.page + 1}
       )}">
        다음
    </a>
</div>


<!-- 게시글 버튼 -->
<a th:href="@{/boards}">
    목록
</a>

<!-- 게시글 작성자만 수정/삭제 표시 -->

<div th:if="${loginUser != null
        and loginUser.memberId == board.memberId}">

<a th:href="@{/boards/{boardId}/edit(
        boardId=${board.boardId}
        )}">
          수정
  </a>

<form th:action="@{/boards/{boardId}/delete(
        boardId=${board.boardId}
        )}"
      method="post"
      onsubmit="return confirm('게시글을 정말 삭제하시겠습니까?');">

    <button type="submit">
      삭제
    </button>
</form>
</div>

<script>
    function toggleEdit(commentId) {

        const editForm =
            document.getElementById("editForm-" + commentId);

        if (editForm.style.display === "none") {
            editForm.style.display = "block";
        }else {
            editForm.style.display = "none";
        }
    }
</script>
</body>
</html>
