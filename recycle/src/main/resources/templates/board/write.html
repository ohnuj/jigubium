<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <link rel="stylesheet" th:href="@{/css/board.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/common :: nav}">
</th:block>

<main>
    <section class="board-hero">
        <div class="board-hero-inner">
            <span class="hero-badge">COMMUNITY</span>
            <h1>새 글 <strong>작성</strong></h1>
            <p>커뮤니티에 새로운 이야기를 남겨보세요.</p>
        </div>
    </section>

    <section class="board-container narrow">
        <form id="writeForm" class="panel form-panel form-grid" th:action="@{/boards/write}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="boardType">게시판 타입</label>
                <select id="boardType" name="boardType" required>
                    <option value="">선택</option>
                    <option value="FREE">자유</option>
                    <option value="INFO">정보</option>
                    <option value="SUGGESTION">건의</option>
                </select>
            </div>

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content" name="content" rows="10" required></textarea>
            </div>

            <div class="form-group">
                <span class="form-group-title">이미지</span>
                <p class="helper-text">이미지는 최대 5장, 파일당 5MB까지 등록할 수 있습니다.</p>

                <input class="file-input" type="file" id="imageInput" accept="image/*">
                <input type="file" id="images" name="images" multiple hidden>
                <div id="imageList" class="image-list"></div>
            </div>

            <div class="form-actions">
                <a class="btn btn-secondary" th:href="@{/boards}"
                   onclick="return confirm('작성 중인 내용이 사라집니다. 취소하시겠습니까?');">취소</a>
                <button class="btn btn-primary" type="submit" id="submitBtn">등록</button>
            </div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/common :: footer}">
</th:block>
<script>
    const imageInput = document.getElementById("imageInput");
    const images = document.getElementById("images");
    const imageList = document.getElementById("imageList");
    let selectedFiles = [];
    const MAX_IMAGES = 5;
    const MAX_FILE_SIZE = 5 * 1024 * 1024;

    imageInput.addEventListener("change", function () {
        if (this.files.length === 0) return;

        const file = this.files[0];

        if (selectedFiles.length >= MAX_IMAGES) {
            alert("이미지는 최대 5장까지 등록할 수 있습니다.");
            this.value = "";
            return;
        }

        if (file.size > MAX_FILE_SIZE) {
            alert("이미지 한 장의 크기는 최대 5MB까지 가능합니다.");
            this.value = "";
            return;
        }

        selectedFiles.push(file);
        updateFiles();
        this.value = "";
    });

    function updateFiles() {
        const dataTransfer = new DataTransfer();
        selectedFiles.forEach(file => dataTransfer.items.add(file));
        images.files = dataTransfer.files;
        imageList.innerHTML = "";

        selectedFiles.forEach((file, index) => {
            const div = document.createElement("div");
            const previewUrl = URL.createObjectURL(file);
            div.innerHTML = `
                <img src="${previewUrl}" alt="이미지 미리보기">
                <span>${file.name}</span>
                <button type="button" onclick="removeImage(${index})">취소</button>
            `;
            imageList.appendChild(div);
        });
    }

    function removeImage(index) {
        selectedFiles.splice(index, 1);
        updateFiles();
    }

    const writeForm = document.getElementById("writeForm");
    const submitBtn = document.getElementById("submitBtn");

    writeForm.addEventListener("submit", function () {
        submitBtn.disabled = true;
        submitBtn.textContent = "등록 중...";
    });
</script>
</body>
</html>
