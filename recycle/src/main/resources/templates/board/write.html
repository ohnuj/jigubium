<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
</head>
<body>
<nav>
    <div>
        <a th:href="@{/}">Home</a>

        <div>
            <th:block>
                <a th:href="@{/login}">로그인</a>
                <a th:href="@{/signup}">회원가입</a>
            </th:block>

            <th:block>
                <a th:href="@{/mypage}">마이페이지</a>
                <a th:href="@{/logout}">로그아웃</a>
            </th:block>
        </div>
    </div>
</nav>
<h2>게시글 작성</h2>

<form th:action="@{/boards}"
      method="post"
      enctype="multipart/form-data">

    <!-- 게시판 타입 -->
    <div>
        <label for="boardType">게시판 타입</label>

        <select id="boardType"
                name="boardType"
                required>

            <option value="">선택</option>

            <option value="FREE">자유</option>
            <option value="INFO">정보</option>
            <option value="SUGGESTION">건의</option>
        </select>
    </div>

    <!-- 제목 -->
    <div>
        <label for="title">제목</label>

        <input type="text"
                id="title"
                name="title"
                required>
    </div>

    <div>
        <label for="content">내용</label>

        <textarea id="content"
                  name="content"
                  rows="10"
                  required></textarea>
    </div>

    <!--이미지-->
    <div>
        <label for="images">이미지</label>

        <!-- 한 장씩 선택 -->
        <input type="file"
               id="imageInput"
               accept="image/*">

        <!-- 실제 서버로 전송할 파일 input -->
        <input type="file"
               id="images"
               name="images"
               multiple
               hidden>

        <!-- 선택한 이미지 목록 -->
        <div id="imageList"></div>
    </div>

    <button type="submit">등록</button>

    <a th:href="@{/boards}">
        취소
    </a>


</form>

<script>
    const imageInput = document.getElementById("imageInput");
    const images = document.getElementById("images");
    const imageList = document.getElementById("imageList");

    // 선택한 파일을 누적해서 보관
    let selectedFiles = [];

    imageInput.addEventListener("change", function () {

        if (this.files.length === 0) {
            return;
        }

        // 이번에 선택한 파일 추가
        selectedFiles.push(this.files[0]);

        updateFiles();

        // 같은 파일도 다시 선택할 수 있도록 초기화
        this.value = "";
    });

    function updateFiles() {

        // 서버로 전송할 파일 목록 생성
        const dataTransfer = new DataTransfer();

        selectedFiles.forEach(file => {
            dataTransfer.items.add(file);
        });

        images.files = dataTransfer.files;

        // 화면의 파일 목록 다시 출력
        imageList.innerHTML = "";

        selectedFiles.forEach((file, index) => {

            const div = document.createElement("div");

            // 선택한 이미지의 임시 미리보기 주소
            const previewUrl = URL.createObjectURL(file);

            div.innerHTML = `
             <img src="${previewUrl}"
                     alt="이미지 미리보기"
                     width="100">

                <span>${file.name}</span>

                <button type="button"
                        onclick="removeImage(${index})">
                    취소
                </button>
                `;

            imageList.appendChild(div);
        });
    }

    function removeImage(index) {

        // 해당 이미지 제거
        selectedFiles.splice(index, 1);

        // 서버 전송 파일 목록도 다시 생성
        updateFiles();
    }
</script>
</body>
</html>
