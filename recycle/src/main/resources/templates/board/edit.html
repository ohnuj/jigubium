<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <link rel="stylesheet" th:href="@{/css/board.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/common :: nav}">
</th:block>

<main>
    <section class="board-hero">
        <div class="board-hero-inner">
            <span class="hero-badge">COMMUNITY</span>
            <h1>게시글 <strong>수정</strong></h1>
            <p>게시글 내용과 첨부 이미지를 수정할 수 있습니다.</p>
        </div>
    </section>

    <section class="board-container narrow">
        <section class="panel current-images-section"
                 th:if="${board.images != null and !#lists.isEmpty(board.images)}">
            <span class="section-label">CURRENT IMAGES</span>
            <h2>현재 이미지</h2>

            <div class="current-image-list">
                <div class="current-image-item" th:each="image : ${board.images}">
                    <img th:src="${image.imageUrl}" alt="게시글 이미지">

                    <form th:action="@{/boards/{boardId}/images/{imageId}/delete(
        boardId=${board.boardId},
        imageId=${image.imageId},
        page=${page},
        keyword=${keyword},
        searchType=${searchType},
        boardType=${listBoardType},
        sort=${sort},
        myPosts=${myPosts}
      )}"
                          method="post"
                          onsubmit="return confirm('이 이미지를 삭제하시겠습니까?');">
                        <button type="submit">삭제</button>
                    </form>
                </div>
            </div>
        </section>

        <form class="panel form-panel form-grid"
              th:action="@{/boards/{boardId}/edit(
            boardId=${board.boardId},
            page=${page},
            keyword=${keyword},
            searchType=${searchType},
            listBoardType=${listBoardType},
            sort=${sort},
            myPosts=${myPosts}
      )}"
              method="post"
              enctype="multipart/form-data">

            <div class="form-group">
                <label for="boardType">게시판 타입</label>
                <select id="boardType" name="boardType" required>
                    <option value="FREE" th:selected="${board.boardType.name() == 'FREE'}">자유</option>
                    <option value="INFO" th:selected="${board.boardType.name() == 'INFO'}">정보</option>
                    <option value="SUGGESTION" th:selected="${board.boardType.name() == 'SUGGESTION'}">건의</option>
                </select>
            </div>

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" th:value="${board.title}" required>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content" name="content" rows="10" required th:text="${board.content}"></textarea>
            </div>

            <div class="form-group">
                <span class="form-group-title">새 이미지 추가</span>
                <p class="helper-text">새 이미지를 한 장씩 선택해 추가할 수 있습니다.</p>

                <input class="file-input" type="file" id="imageInput" accept="image/*">
                <input type="file" id="images" name="images" multiple hidden>
                <div id="imageList" class="image-list"></div>
            </div>

            <div class="form-actions">
                <a class="btn btn-secondary"
                   th:href="@{/boards/{boardId}(
        boardId=${board.boardId},
        page=${page},
        keyword=${keyword},
        searchType=${searchType},
        boardType=${listBoardType},
        sort=${sort},
        myPosts=${myPosts}
   )}">
                    취소
                </a>
                <button class="btn btn-primary" type="submit">수정</button>
            </div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/common :: footer}">
</th:block>

<script>
    const imageInput = document.getElementById("imageInput");
    const images = document.getElementById("images");
    const imageList = document.getElementById("imageList");
    let selectedFiles = [];

    imageInput.addEventListener("change", function () {
        if (this.files.length === 0) return;
        selectedFiles.push(this.files[0]);
        updateFiles();
        this.value = "";
    });

    function updateFiles() {
        const dataTransfer = new DataTransfer();
        selectedFiles.forEach(file => dataTransfer.items.add(file));
        images.files = dataTransfer.files;
        imageList.innerHTML = "";

        selectedFiles.forEach((file, index) => {
            const div = document.createElement("div");
            const previewUrl = URL.createObjectURL(file);
            div.innerHTML = `
                <img src="${previewUrl}" alt="새 이미지 미리보기">
                <span>${file.name}</span>
                <button type="button" onclick="removeImage(${index})">취소</button>
            `;
            imageList.appendChild(div);
        });
    }

    function removeImage(index) {
        selectedFiles.splice(index, 1);
        updateFiles();
    }
</script>
</body>
</html>
