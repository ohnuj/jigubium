<!DOCTYPE html>
<!-- 타임리프(Thymeleaf) 네임스페이스 선언: th:* 속성 사용을 위해 필요 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 지구비우기</title>
    <!-- static 폴더 기준 CSS 경로 연결 (/static/css/Login.css) -->
    <link rel="stylesheet" th:href="@{/css/Login.css}">
</head>
<body>

<!-- 전체 화면 중앙 정렬 및 배경 레이아웃 감싸는 영역 -->
<div class="auth-wrap">
    <!-- 회원가입 폼 카드 컨테이너 -->
    <div class="auth-card">
        <h1 class="logo">지구비우기 회원가입</h1>

        <!-- 컨트롤러에서 model.addAttribute("error", ...)로 넘겨준 에러가 있을 때만 렌더링 -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- POST /signup 요청 전송 -> SignupController의 @PostMapping("/signup")으로 전달 -->
        <form th:action="@{/signup}" method="post">
            <!-- 사용자 이름 입력 -> User 객체의 name 필드에 매핑 -->
            <div>
                <input type="text" name="name" placeholder="이름" required autofocus>
            </div>
            <!-- 닉네임 입력 -> User 객체의 nickname 필드에 매핑 -->
            <div>
                <input type="text" name="nickname" placeholder="닉네임" required>
            </div>
            <!-- 이메일 입력 -> User 객체의 email 필드에 매핑 (형식 검증 포함) -->
            <div>
                <input type="email" name="email" placeholder="이메일" required>
            </div>
            <!-- 비밀번호 입력 -> User 객체의 password 필드에 매핑 (마스킹 처리) -->
            <div>
                <input type="password" name="password" id="password" placeholder="비밀번호" required>
            </div>
            <div>
                <input type="password" id="passwordConfirm"
                       placeholder="비밀번호 확인" required>
                <!-- 실시간 일치 여부 안내 텍스트 -->
                <div id="pwCheckMsg" class="pw-msg"></div>
            </div>

            <!-- 폼 제출 버튼 -> 클릭 시 입력 데이터 전송 -->
            <button type="submit" class="btn-primary">가입하기</button>
        </form>

        <!-- 카카오 소셜 로그인 연동 링크 버튼 (/oauth/kakao 호출) -->
        <div>
            <a th:href="@{/oauth/kakao}" class="btn-kakao">카카오계정으로 가입하기</a>
        </div>

        <!-- 로그인 페이지(/login) 이동 링크 -->
        <p class="auth-footer">
            이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
        </p>
    </div>
</div>
<script>
    const signupForm = document.querySelector('form');
    const pwInput = document.getElementById('password');
    const pwConfirmInput = document.getElementById('passwordConfirm');
    const pwCheckMsg = document.getElementById('pwCheckMsg');

    // 1. 입력 시 실시간 검사 문구 노출
    function validatePasswordMatch() {
        const pw = pwInput.value;
        const pwConfirm = pwConfirmInput.value;

        if (!pwConfirm) {
            pwCheckMsg.style.display = 'none';
            return;
        }

        pwCheckMsg.style.display = 'block';
        if (pw === pwConfirm) {
            pwCheckMsg.textContent = '비밀번호가 일치합니다.';
            pwCheckMsg.style.color = '#2b8a3e'; // 초록색
        } else {
            pwCheckMsg.textContent = '비밀번호가 일치하지 않습니다.';
            pwCheckMsg.style.color = '#e03131'; // 빨간색
        }
    }

    pwInput.addEventListener('input', validatePasswordMatch);
    pwConfirmInput.addEventListener('input', validatePasswordMatch);

    // 2. 가입하기 버튼 클릭(제출) 시 불일치하면 전송 차단
    signupForm.addEventListener('submit', function (e) {
        if (pwInput.value !== pwConfirmInput.value) {
            e.preventDefault(); // 전송 즉시 차단
            alert('비밀번호가 일치하지 않습니다. 다시 확인해주세요.');
            pwConfirmInput.focus();
        }
    });
</script>
</body>
</html>
