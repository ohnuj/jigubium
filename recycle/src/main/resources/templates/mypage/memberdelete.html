<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 탈퇴</title>
</head>
<body>
<div style="display: flex; gap: 40px;">
    <!-- 좌측 4가지 탭 메뉴 (4번 탭 강조) -->
    <aside style="width: 180px;">
        <ul style="list-style: none; padding: 0; line-height: 2.2;">
            <li><a th:href="@{/mypage/myinfo}">내 정보</a></li>
            <li><a th:href="@{/mypage/memberinfoconfirm}">회원정보 수정</a></li>
            <li><a th:href="@{/mypage/memberactivity}">나의 활동</a></li>
            <li style="font-weight: bold;"><a th:href="@{/mypage/memberdelete}">회원 탈퇴</a></li>
        </ul>
    </aside>

    <!-- 우측 본문 영역 -->
    <main>
        <h2>회원 탈퇴</h2>
        <p>탈퇴 시 계정 복구가 불가능합니다. 본인 확인을 위해 비밀번호를 입력해주세요.</p>

        <form th:action="@{/mypage/memberdelete}" method="post">
            <div>
                <label for="password">비밀번호 확인</label>
                <input type="password" id="password" name="password" placeholder="현재 비밀번호 입력" required>
            </div>

            <!-- 비밀번호 불일치 등 에러 메시지 출력 -->
            <p th:if="${errorMsg}" style="color: red;" th:text="${errorMsg}"></p>

            <button type="submit" style="margin-top: 10px; background-color: #dc3545; color: white; border: none; padding: 6px 12px; cursor: pointer;">
                탈퇴하기
            </button>
        </form>
    </main>
</div>
</body>
</html>
