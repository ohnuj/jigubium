<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 회원정보 수정</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css(v=12)}">
</head>
<body>

<!-- 상단 네비게이션 바 -->
<nav>
    <div class="nav-inner">
        <div class="nav-left">
            <a th:href="@{/}">♻️ 지구비우기</a>
        </div>
        <div class="nav-center">
            <a th:href="@{/eco-map}">에코맵</a>
            <a th:href="@{/game}">재활용게임</a>
            <a th:href="@{/boards}">커뮤니티</a>
        </div>
        <div class="nav-right">
            <th:block th:unless="${session.checkLogin}">
                <a th:href="@{/login}">로그인</a>
                <a th:href="@{/signup}">회원가입</a>
            </th:block>

            <th:block th:if="${session.checkLogin}">
                <a th:href="@{/mypage}" class="active">마이페이지</a>
                <a th:href="@{/logout}">로그아웃</a>
                <a th:href="@{/reward}">리워드 상점</a>
            </th:block>
        </div>
    </div>
</nav>

<div class="mypage-container">
    <!-- 좌측 사이드바 (2번 탭 활성화) -->
    <aside class="mypage-sidebar">
        <ul class="mypage-menu-list">
            <li><a th:href="@{/mypage/myinfo}">내 정보</a></li>
            <li class="active"><a th:href="@{/mypage/memberinfoconfirm}">회원정보 수정</a></li>
            <li><a th:href="@{/mypage/memberactivity}">나의 활동</a></li>
            <li><a th:href="@{/mypage/memberdelete}">회원 탈퇴</a></li>
        </ul>
    </aside>

    <!-- 우측 메인 -->
    <main class="mypage-main">
        <div class="mypage-title-area">
            <h2>회원정보 수정</h2>
            <p>닉네임 변경 및 신규 비밀번호 설정을 진행할 수 있습니다.</p>
        </div>

        <div class="mypage-card">
            <div class="alert-error" th:if="${errorMsg}" th:text="${errorMsg}">
                비밀번호 확인이 일치하지 않습니다.
            </div>

            <form th:action="@{/mypage/updatememberinfo}" method="post">
                <!-- 이메일 (수정 불가) -->
                <div class="form-group">
                    <label>이메일 계정</label>
                    <input type="text" class="mypage-input" th:value="${member != null ? member.email : ''}" readonly>
                </div>

                <!-- 닉네임 수정 -->
                <div class="form-group">
                    <label for="nickname">닉네임</label>
                    <input type="text" id="nickname" name="nickname" class="mypage-input"
                           th:value="${member != null ? member.nickname : ''}" required>
                </div>

                <!-- 새 비밀번호 -->
                <div class="form-group">
                    <label for="newpassword">새 비밀번호 (선택)</label>
                    <input type="password" id="newpassword" name="newpassword" class="mypage-input"
                           placeholder="변경을 원할 때만 새 비밀번호를 입력해주세요.">
                </div>

                <!-- 새 비밀번호 확인 -->
                <div class="form-group">
                    <label for="newpasswordconfirm">새 비밀번호 확인</label>
                    <input type="password" id="newpasswordconfirm" name="newpasswordconfirm" class="mypage-input"
                           placeholder="새 비밀번호를 한 번 더 입력해주세요.">
                </div>

                <button type="submit" class="btn-submit-green" style="margin-top: 10px;">정보 수정 완료</button>
            </form>
        </div>
    </main>
</div>

<!-- 공통 푸터 -->
<footer th:replace="~{index :: footer}"></footer>

</body>
</html>
