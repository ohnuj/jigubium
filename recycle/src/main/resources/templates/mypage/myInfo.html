<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 - 내 정보</title>
</head>
<body>
<nav>
    <div>
        <a th:href="@{/}">Home</a>
        <th:block th:unless="${session.checkLogin}">
            <a th:href="@{/login}">로그인</a>
            <a th:href="@{/signup}">회원가입</a>
        </th:block>

        <th:block th:if="${session.checkLogin}">
            <a th:href="@{/mypage}">마이페이지</a>
            <a th:href="@{/logout}">로그아웃</a>
            <a th:href="@{/reward}">리워드 상점</a>
        </th:block>
    </div>
</nav>
<div style="display:flex; gap: 40px; max-width: 900px; margin:30px auto">
    <!-- 좌측 4가지 탭 메뉴 (1번 탭 강조) -->
    <aside style="width: 180px;">
        <ul style="list-style: none; padding: 0; line-height: 2.2;">
            <li style="font-weight: bold;"><a th:href="@{/mypage/myinfo}">내 정보</a></li>
            <li><a th:href="@{/mypage/memberinfoconfirm}">회원정보 수정</a></li>
            <li><a th:href="@{/mypage/memberactivity}">나의 활동</a></li>
            <li><a th:href="@{/mypage/memberdelete}">회원 탈퇴</a></li>
        </ul>
    </aside>

    <!-- 내 정보 본문 -->
    <main style="flex:1;">
        <h2>내 정보</h2>
        <!-- 전체 정보를 감싸는 회색 박스 시작 -->
        <div style="background-color: #f8f9fa; padding: 25px; border-radius: 8px; line-height: 2.2; border: 1px solid #e9ecef;">

            <!-- 뱃지(회원 등급) -->
            <div style="display: flex; align-items: center; gap: 6px;">
                <strong>회원 등급:</strong>

                <!-- 1단계: 씨앗 (0 ~ 249점) -->
                <span th:if="${totalPoint == null or totalPoint < 250}" style="display: inline-flex; align-items: center; gap: 5px;">
                    <img th:src="@{/images/seeds.png}" alt="씨앗" style="width: 18px; height: 18px; object-fit: contain; vertical-align: middle;">
                    <span style="font-weight: 600; color: #8d6e63;">씨앗(1단계)</span>
                </span>

                <!-- 2단계: 새싹 (250 ~ 499점) -->
                <span th:if="${totalPoint != null and totalPoint >= 250 and totalPoint < 500}" style="display: inline-flex; align-items: center; gap: 5px;">
                    <img th:src="@{/images/sprout.png}" alt="새싹" style="width: 18px; height: 18px; object-fit: contain; vertical-align: middle;">
                    <span style="font-weight: 600; color: #4caf50;">새싹(2단계)</span>
                </span>

                <!-- 3단계: 나무 (500 ~ 749점) -->
                <span th:if="${totalPoint != null and totalPoint >= 500 and totalPoint < 750}" style="display: inline-flex; align-items: center; gap: 5px;">
                    <img th:src="@{/images/tree.png}" alt="나무" style="width: 18px; height: 18px; object-fit: contain; vertical-align: middle;">
                    <span style="font-weight: 600; color: #2e7d32;">나무(3단계)</span>
                </span>

                <!-- 4단계: 열매 (750점 이상) -->
                <span th:if="${totalPoint != null and totalPoint >= 750}" style="display: inline-flex; align-items: center; gap: 5px;">
                    <img th:src="@{/images/fruit.png}" alt="열매" style="width: 18px; height: 18px; object-fit: contain; vertical-align: middle;">
                    <span style="font-weight: 600; color: #e91e63;">열매(4단계)</span>
                </span>

                <!-- 누적 포인트 표기 -->
                <span style="font-size: 0.85em; color: #888; margin-left: 4px;"
                      th:text="'(누적 ' + ${#numbers.formatInteger(totalPoint != null ? totalPoint : 0, 0, 'COMMA')} + 'P)'">
                    (누적 0P)
                </span>
            </div>

            <!-- 이름 -->
            <div>
                <strong>이름:</strong>
                <span th:text="${member.name != null ? member.name : '이름 없음'}">홍길동</span>
            </div>

            <!-- 닉네임 -->
            <div>
                <strong>닉네임:</strong>
                <span th:text="${member.nickname}">닉네임</span>
            </div>

            <!-- 이메일 -->
            <div>
                <strong>이메일:</strong>
                <span th:text="${member.email}">user@example.com</span>
            </div>

            <!-- 보유 에코포인트 (EcoPointHistory의 가장 최신 balance_after) -->
            <div>
                <strong>보유 에코포인트:</strong>
                <strong style="color: #28a745; font-size: 1.15em;"
                        th:text="${#numbers.formatInteger(currentPoint != null ? currentPoint : 0, 0, 'COMMA')} + ' P'">
                    0 P
                </strong>
            </div>

            <!-- 가입일 -->
            <div th:if="${member.createdAt != null}">
                <strong>가입일:</strong>
                <span th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-20 18:30</span>
            </div>

        </div>
        <!-- 전체 정보를 감싸는 회색 박스 끝 -->
    </main>
</div>
</body>
</html>
