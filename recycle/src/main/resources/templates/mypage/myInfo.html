<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 내 정보</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css(v=12)}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<!-- 상단 네비게이션 바 -->
<th:block th:replace="~{fragments/common :: nav}">
</th:block>

<div class="mypage-container">
    <!-- 좌측 사이드바 (1번 탭 활성화) -->
    <aside class="mypage-sidebar">
        <ul class="mypage-menu-list">
            <li class="active"><a th:href="@{/mypage/myinfo}">내 정보</a></li>
            <li><a th:href="@{/mypage/memberinfoconfirm}">회원정보 수정</a></li>
            <li><a th:href="@{/mypage/memberactivity}">나의 활동</a></li>
            <li><a th:href="@{/mypage/memberdelete}">회원 탈퇴</a></li>
        </ul>
    </aside>

    <!-- 우측 본문 -->
    <main class="mypage-main">
        <div class="mypage-title-area">
            <h2>내 정보</h2>
            <p>기본 회원 정보와 현재 보유 에코포인트를 확인합니다.</p>
        </div>

        <div class="mypage-card">
            <!-- 1. 회원 등급 (씨앗 / 새싹 / 나무 / 열매) -->
            <div class="info-row">
                <span class="info-label">회원 등급</span>
                <div class="info-value">
                    <div class="grade-badge-wrap">
                        <!-- 1단계 씨앗 (0 ~ 249P) -->
                        <th:block th:if="${totalPoint == null or totalPoint < 250}">
                            <img th:src="@{/images/seed.png}" alt="씨앗" onerror="this.style.display='none'">
                            <span class="grade-name" style="color: #795548;">씨앗 (1단계)</span>
                        </th:block>

                        <!-- 2단계 새싹 (250 ~ 499P) -->
                        <th:block th:if="${totalPoint != null and totalPoint >= 250 and totalPoint < 500}">
                            <img th:src="@{/images/sprout.png}" alt="새싹" onerror="this.style.display='none'">
                            <span class="grade-name" style="color: #2e7d32;">새싹 (2단계)</span>
                        </th:block>

                        <!-- 3단계 나무 (500 ~ 749P) -->
                        <th:block th:if="${totalPoint != null and totalPoint >= 500 and totalPoint < 750}">
                            <img th:src="@{/images/tree.png}" alt="나무" onerror="this.style.display='none'">
                            <span class="grade-name" style="color: #1b5e20;">나무 (3단계)</span>
                        </th:block>

                        <!-- 4단계 열매 (750P 이상) -->
                        <th:block th:if="${totalPoint != null and totalPoint >= 750}">
                            <img th:src="@{/images/fruit.png}" alt="열매" onerror="this.style.display='none'">
                            <span class="grade-name" style="color: #d32f2f;">열매 (4단계)</span>
                        </th:block>

                        <!-- 누적 적립 표시 -->
                        <span class="grade-total"
                              th:text="'(누적 적립 ' + ${#numbers.formatInteger(totalPoint != null ? totalPoint : 0, 0, 'COMMA')} + ' P)'">
                            (누적 적립 0 P)
                        </span>
                    </div>
                </div>
            </div>

            <!-- 2. 닉네임 -->
            <div class="info-row">
                <span class="info-label">닉네임</span>
                <div class="info-value" th:text="${member != null ? member.nickname : ''}">닉네임</div>
            </div>

            <!-- 3. 이메일 -->
            <div class="info-row">
                <span class="info-label">이메일</span>
                <div class="info-value" th:text="${member != null ? member.email : ''}">user@example.com</div>
            </div>

            <!-- 4. 현재 보유 포인트 -->
            <div class="info-row">
                <span class="info-label">보유 포인트</span>
                <div class="info-value">
                    <div class="point-badge">
                        <strong th:text="${#numbers.formatInteger(currentPoint != null ? currentPoint : 0, 0, 'COMMA')}">0</strong>
                        <span>P</span>
                    </div>
                </div>
            </div>

            <!-- 5. 가입일 -->
            <div class="info-row">
                <span class="info-label">가입일</span>
                <div class="info-value"
                     th:text="${member != null and member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy년 MM월 dd일') : '-'}">
                    2026년 08월 24일
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 공통 푸터 -->
<th:block th:replace="~{fragments/common :: footer}">
</th:block>

</body>
</html>
