<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 회원 탈퇴</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css(v=12)}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<!-- 상단 네비게이션 바 -->
<th:block th:replace="~{fragments/common :: nav}">
</th:block>

<div class="mypage-container">

    <!-- 좌측 사이드바 -->
    <aside class="mypage-sidebar">
        <ul class="mypage-menu-list">
            <li><a th:href="@{/mypage/myInfo}">내 정보</a></li>
            <li><a th:href="@{/mypage/memberInfoConfirm}">회원정보 수정</a></li>
            <li><a th:href="@{/mypage/myActivity}">나의 활동</a></li>
            <li class="active">
                <a th:href="@{/mypage/memberDelete}">회원 탈퇴</a>
            </li>
        </ul>
    </aside>

    <!-- 우측 메인 -->
    <main class="mypage-main">

        <div class="mypage-title-area">
            <h2>회원 탈퇴</h2>
            <p>지구비우기 서비스 탈퇴를 진행합니다.</p>
        </div>

        <div class="mypage-card">

            <!-- 오류 메시지 -->
            <div class="alert-error"
                 th:if="${errorMsg}"
                 th:text="${errorMsg}">
                회원 탈퇴에 실패했습니다.
            </div>


            <!-- LOCAL 회원 안내 -->
            <p class="info-help-text"
               th:if="${member != null and member.provider == 'LOCAL'}">

                ⚠️ 탈퇴 시 보유하고 계신 모든
                <strong>에코포인트와 활동 이력 데이터가 영구 삭제</strong>되며
                복구할 수 없습니다.<br>

                계속 진행하시려면 현재 비밀번호를 입력해주세요.
            </p>


            <!-- KAKAO 회원 안내 -->
            <p class="info-help-text"
               th:if="${member != null and member.provider != 'LOCAL'}">

                ⚠️ 탈퇴 시 보유하고 계신 모든
                <strong>에코포인트와 활동 이력 데이터가 영구 삭제</strong>되며
                복구할 수 없습니다.<br>

                탈퇴 버튼을 누르면 회원 탈퇴 확인 후 즉시 탈퇴 처리됩니다.
            </p>


            <form th:action="@{/mypage/memberDelete}"
                  method="post"
                  onsubmit="return confirm('정말로 탈퇴하시겠습니까? 탈퇴 후 복구는 불가능합니다.');">


                <!-- LOCAL 회원에게만 비밀번호 입력 표시 -->
                <div class="form-group"
                     th:if="${member != null and member.provider == 'LOCAL'}">

                    <label for="password">
                        비밀번호 확인
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="mypage-input"
                           placeholder="현재 비밀번호를 입력해주세요."
                           required>

                </div>


                <!-- LOCAL / KAKAO 공통 -->
                <button type="submit"
                        class="btn-danger">
                    회원 탈퇴 진행
                </button>

            </form>

        </div>

    </main>

</div>


<!-- 공통 푸터 -->
<th:block th:replace="~{fragments/common :: footer}">
</th:block>

</body>
</html>
