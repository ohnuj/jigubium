<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지구비우기 통합 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <!-- 로고/타이틀 -->
        <a href="/" class="nav-logo">♻️ 지구비우기 통합 회원가입</a>

        <!-- 중복 닉네임 에러 알림 -->
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/oauth/signup}" method="post">
            <!-- 닉네임 입력 -->
            <div>
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="nickname"
                       placeholder="2~12자리의 한글, 영어, 숫자만 가능"
                       minlength="2"
                       maxlength="12"
                       pattern="^[a-zA-Z0-9가-힣ㄱ-ㅎㅏ-ㅣ]{2,12}$"
                       title="닉네임은 2~12자리의 한글, 영문, 숫자만 가능합니다."
                       required>
            </div>

            <!-- 성별 선택 (화면 표시용) -->
            <div>
                <label for="gender">성별</label>
                <select id="gender" name="gender">
                    <option value="U">선택 안 함</option>
                    <option value="M">남자</option>
                    <option value="F">여자</option>
                </select>
            </div>

            <!-- 가입 완료 버튼 -->
            <button type="submit" class="btn-primary">회원가입</button>
        </form>

        <div class="auth-footer">
            회원정보를 정확히 입력해주세요
        </div>
    </div>
</div>

</body>
</html>
