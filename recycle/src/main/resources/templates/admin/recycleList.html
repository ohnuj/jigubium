<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>재활용 품목 관리</title>

    <link rel="stylesheet" th:href="@{/css/admin.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>


<!-- =====================================================
     상단 네비게이션
===================================================== -->
<th:block th:replace="~{fragments/common :: nav}">
</th:block>


<main class="admin-management-page">


    <!-- =====================================================
         Hero
    ===================================================== -->
    <section class="admin-page-header">

        <div class="admin-page-header-inner">

            <span class="admin-page-label">
                ADMIN · RECYCLE ITEM
            </span>

            <h1>
                재활용 품목 관리
            </h1>

            <p>
                재활용 품목의 기본 정보와 배출 정보,
                관련 키워드를 조회하고 수정할 수 있습니다.
            </p>

        </div>

    </section>


    <!-- =====================================================
         콘텐츠
    ===================================================== -->
    <section class="admin-list-content">


        <div class="admin-list-header">

            <div>

                <span class="section-label">
                    RECYCLE DATABASE
                </span>

                <h2>
                    재활용 품목 목록
                </h2>

                <p>
                    등록된 품목을 검색하고 관리하세요.
                </p>

            </div>


            <a class="admin-home-button"
               th:href="@{/admin}">
                ← 관리자 홈
            </a>

        </div>


        <!-- =================================================
             검색
        ================================================== -->
        <div class="admin-search-box">

            <form th:action="@{/admin/recycle-items}"
                  method="get">

                <div class="admin-search-input">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                            type="text"
                            name="keyword"
                            th:value="${keyword}"
                            placeholder="품목명, 카테고리, 관련 키워드 검색"
                            autocomplete="off">

                </div>


                <button class="search-button"
                        type="submit">
                    검색
                </button>


                <a class="reset-button"
                   th:href="@{/admin/recycle-items}">
                    초기화
                </a>

            </form>

        </div>


        <!-- =================================================
             테이블
        ================================================== -->
        <div class="admin-table-card">

            <div class="admin-table-wrapper">

                <table class="admin-table recycle-item-table">

                    <colgroup>
                        <col class="recycle-col-id">
                        <col class="recycle-col-name">
                        <col class="recycle-col-category">
                        <col class="recycle-col-keyword">
                        <col class="recycle-col-action">
                    </colgroup>


                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>품목명</th>
                        <th>카테고리</th>
                        <th>관련 키워드</th>
                        <th>관리</th>
                    </tr>

                    </thead>


                    <tbody>

                    <th:block th:each="item : ${items}">


                        <!-- 기본 행 -->
                        <tr class="view-row"
                            th:id="'view-row-' + ${item.itemId}">


                            <td class="item-id"
                                th:text="${item.itemId}">
                            </td>


                            <td>

                                <strong class="item-name"
                                        th:text="${item.itemName}">
                                </strong>

                            </td>


                            <td>

                                <span class="category-tag"
                                      th:text="${item.categoryName}">
                                </span>

                            </td>


                            <td>

                                <div class="keyword-text"
                                     th:text="${item.searchKeyword}">
                                </div>

                            </td>


                            <td>

                                <div class="action-buttons">

                                    <button class="edit-button"
                                            type="button"
                                            th:onclick="'openEdit(' + ${item.itemId} + ')'">

                                        수정

                                    </button>


                                    <form class="inline-delete-form"
                                          th:action="@{/admin/recycle-items/{id}/delete(id=${item.itemId})}"
                                          method="post"
                                          onsubmit="return confirm('정말 삭제하시겠습니까?');">


                                        <input type="hidden"
                                               name="page"
                                               th:value="${paging.page}">


                                        <input type="hidden"
                                               name="keyword"
                                               th:value="${keyword}">


                                        <button class="delete-button"
                                                type="submit">
                                            삭제
                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>


                        <!-- =================================================
                             수정폼
                        ================================================== -->
                        <tr class="edit-row"
                            th:id="'edit-row-' + ${item.itemId}"
                            style="display:none;">

                            <td colspan="5">

                                <div class="edit-panel">


                                    <div class="edit-panel-header">

                                        <div>

                                            <span>
                                                ITEM EDIT
                                            </span>

                                            <h3>
                                                재활용 품목 수정
                                            </h3>

                                        </div>


                                        <button class="edit-close-button"
                                                type="button"
                                                th:onclick="'closeEdit(' + ${item.itemId} + ')'">

                                            ✕ 닫기

                                        </button>

                                    </div>


                                    <form class="admin-edit-form"
                                          th:action="@{/admin/recycle-items/{id}/update(id=${item.itemId})}"
                                          method="post">


                                        <input type="hidden"
                                               name="page"
                                               th:value="${paging.page}">


                                        <input type="hidden"
                                               name="keyword"
                                               th:value="${keyword}">


                                        <div class="edit-form-group">

                                            <label>
                                                품목명
                                            </label>

                                            <input type="text"
                                                   name="itemName"
                                                   th:value="${item.itemName}">

                                        </div>


                                        <div class="edit-form-group">

                                            <label>
                                                배출방법
                                            </label>

                                            <textarea name="disposalMethod"
                                                      rows="4"
                                                      th:text="${item.disposalMethod}">
                                            </textarea>

                                        </div>


                                        <div class="edit-form-group">

                                            <label>
                                                특징
                                            </label>

                                            <textarea name="feature"
                                                      rows="4"
                                                      th:text="${item.feature}">
                                            </textarea>

                                        </div>


                                        <div class="edit-form-group">

                                            <label>
                                                주의사항
                                            </label>

                                            <textarea name="caution"
                                                      rows="4"
                                                      th:text="${item.caution}">
                                            </textarea>

                                        </div>


                                        <div class="edit-form-group">

                                            <label>
                                                관련 키워드
                                            </label>

                                            <textarea name="searchKeyword"
                                                      rows="3"
                                                      th:text="${item.searchKeyword}">
                                            </textarea>

                                        </div>


                                        <div class="edit-form-actions">

                                            <button class="save-button"
                                                    type="submit">
                                                저장
                                            </button>


                                            <button class="cancel-button"
                                                    type="button"
                                                    th:onclick="'closeEdit(' + ${item.itemId} + ')'">
                                                취소
                                            </button>

                                        </div>

                                    </form>

                                </div>

                            </td>

                        </tr>

                    </th:block>


                    <tr th:if="${#lists.isEmpty(items)}">

                        <td colspan="5"
                            class="empty-table">

                            <div class="empty-table-icon">
                                🔍
                            </div>

                            <strong>
                                검색 결과가 없습니다.
                            </strong>

                            <p>
                                다른 검색어를 입력해보세요.
                            </p>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- =================================================
             페이징
        ================================================== -->
        <div class="admin-pagination"
             th:if="${paging.totalPages > 0}">


            <a class="page-direction"
               th:if="${startPage > 1}"
               th:href="@{/admin/recycle-items(
                    page=${startPage - 1},
                    keyword=${keyword}
               )}">
                ← 이전
            </a>


            <th:block th:each="pageNum :
                ${#numbers.sequence(startPage, endPage)}">


                <strong class="current-page"
                        th:if="${pageNum == paging.page}"
                        th:text="${pageNum}">
                </strong>


                <a class="page-number"
                   th:unless="${pageNum == paging.page}"
                   th:href="@{/admin/recycle-items(
                        page=${pageNum},
                        keyword=${keyword}
                   )}"
                   th:text="${pageNum}">
                </a>

            </th:block>


            <a class="page-direction"
               th:if="${endPage < paging.totalPages}"
               th:href="@{/admin/recycle-items(
                    page=${endPage + 1},
                    keyword=${keyword}
               )}">
                다음 →
            </a>

        </div>


        <div class="admin-back-area">

            <a th:href="@{/admin}">
                ← 관리자 페이지로 돌아가기
            </a>

        </div>

    </section>

</main>


<!-- =====================================================
     Footer
===================================================== -->
<th:block th:replace="~{fragments/common :: footer}">
</th:block>


<script>

    function openEdit(itemId) {

        const viewRow =
            document.getElementById("view-row-" + itemId);

        const editRow =
            document.getElementById("edit-row-" + itemId);

        viewRow.style.display = "none";
        editRow.style.display = "table-row";
    }


    function closeEdit(itemId) {

        const viewRow =
            document.getElementById("view-row-" + itemId);

        const editRow =
            document.getElementById("edit-row-" + itemId);

        editRow.style.display = "none";
        viewRow.style.display = "table-row";
    }

</script>

</body>
</html>
